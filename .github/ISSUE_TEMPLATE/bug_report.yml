name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a bug in MailHub
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please search [existing issues](https://github.com/kawing11a/mailhub/issues) before submitting.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which area of MailHub does this bug affect?
      options:
        - Dashboard UI / React Frontend
        - IMAP / SMTP Email Sync Engine
        - Gmail / Outlook OAuth
        - Meilisearch Full-Text Search
        - Redis / BullMQ Background Worker
        - Web Push / PWA
        - Docker / Deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Setup
      description: Details about your environment.
      placeholder: |
        - OS: [e.g. Ubuntu 22.04 / macOS / Windows 11]
        - Browser: [e.g. Chrome 124, Firefox 125, Safari 17]
        - Node.js Version: [e.g. 20.x]
        - Deployment Method: [e.g. Docker Compose / Bare Metal]
        - MailHub Version: [e.g. v0.1.0]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste any relevant container logs, console errors, or drag-and-drop screenshots here.
      placeholder: Paste console output or terminal logs here...
    validations:
      required: false
