version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailhub
      POSTGRES_PASSWORD: mailhubpassword
      POSTGRES_DB: mailhub
    ports:
      - "5432:5432"
    volumes:
      - mailhub_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - mailhub_redis_data:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: "meilisearch_dev_master_key_123"
      MEILI_ENV: "development"
      MEILI_EXPERIMENTAL_ALLOWED_IP_NETWORKS: "any"
    ports:
      - "7700:7700"
    volumes:
      - mailhub_meili_data:/meili_data
    restart: unless-stopped

  mailhub-web:
    image: kawing11a/mailhub:0.1.2
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - meilisearch
    volumes:
      - mailhub_storage:/app/.storage

  mailhub-worker-1:
    image: kawing11a/mailhub:0.1.2
    command: npm run worker
    env_file:
      - .env
    environment:
      - WORKER_PARTITION=worker-1
    depends_on:
      - postgres
      - redis
      - meilisearch
    volumes:
      - mailhub_storage:/app/.storage

  mailhub-worker-2:
    image: kawing11a/mailhub:0.1.2
    env_file:
      - .env
    environment:
      - WORKER_PARTITION=worker-2
    command: npm run worker
    depends_on:
      - postgres
      - redis
      - meilisearch
    volumes:
      - mailhub_storage:/app/.storage

volumes:
  mailhub_postgres_data:
  mailhub_redis_data:
  mailhub_meili_data:
  mailhub_storage:
