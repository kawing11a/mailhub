version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailhub
      POSTGRES_PASSWORD: mailhubpassword
      POSTGRES_DB: mailhub
    ports:
      - "5432:5432"
    volumes:
      - mailhub_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - mailhub_redis_data:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: "meilisearch_dev_master_key_123"
      MEILI_ENV: "development"
    ports:
      - "7700:7700"
    volumes:
      - mailhub_meili_data:/meili_data
    restart: unless-stopped

volumes:
  mailhub_postgres_data:
  mailhub_redis_data:
  mailhub_meili_data:
