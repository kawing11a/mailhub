[package]
name = "mailhub-desktop"
version = "0.2.0"
description = "MailHub native desktop client"
authors = ["MailHub"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "mailhub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = { version = "2", features = ["serde"] }
